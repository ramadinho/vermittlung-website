<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Formular-Erkennung</title>
  </head>
  <body>
    <!--
      Diese Datei wird nie im Browser angezeigt. Sie existiert ausschliesslich
      damit Netlify beim Deploy das Kontaktformular automatisch erkennt.
      Siehe: https://docs.netlify.com/manage/forms/setup/
    -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" method="POST">
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>
          Nicht ausfüllen: <input name="bot-field" />
        </label>
      </p>
      <input type="email" name="email" />
      <input type="text" name="name" />
      <input type="tel" name="phone" />
      <input type="text" name="address" />
      <textarea name="description"></textarea>
      <input type="file" name="files" multiple />
    </form>
  </body>
</html>
